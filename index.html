    <script>
        const SUPABASE_URL = "https://mjkqkyuolsqhtxwzivof.supabase.co";
        const SUPABASE_KEY = "sb_publishable_taL59MpBnTvHmpfD8eMSnw_f2QuR6w-";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const loginScreen = document.getElementById('login-screen');
        const registerScreen = document.getElementById('register-screen');
        const forgotScreen = document.getElementById('forgot-screen');
        const appScreen = document.getElementById('app-screen');
        
        const formLogin = document.getElementById('form-login');
        const formRegister = document.getElementById('form-register');
        const formForgot = document.getElementById('form-forgot');
        
        const loginUser = document.getElementById('login-user');
        const loginPass = document.getElementById('login-pass');
        
        const regUser = document.getElementById('reg-user');
        const regPass = document.getElementById('reg-pass');
        const regLoja = document.getElementById('reg-loja');

        const forgotUser = document.getElementById('forgot-user');
        const forgotLoja = document.getElementById('forgot-loja');
        const forgotNewPass = document.getElementById('forgot-new-pass');

        const btnShowRegister = document.getElementById('btn-show-register');
        const btnShowForgot = document.getElementById('btn-show-forgot');
        const btnBackLogin = document.getElementById('btn-back-login');
        const btnBackLoginForgot = document.getElementById('btn-back-login-forgot');
        const btnLogout = document.getElementById('btn-logout');
        const btnToggleTheme = document.getElementById('btn-toggle-theme');
        
        const lblLojaNome = document.getElementById('lbl-loja-nome');
        const lblUserNome = document.getElementById('lbl-user-nome');
        const inputSearch = document.getElementById('input-search');
        const selectCategoria = document.getElementById('select-categoria');
        const btnBuscar = document.getElementById('btn-buscar');
        const resultsContainer = document.getElementById('results-container');
        const statusAlert = document.getElementById('status-alert');

        let usuarioLogado = null;

        // LÓGICA DO TEMA DIA / NOITE
        function inicializarTema() {
            const temaSalvo = localStorage.getItem('nexxa_tema');
            if (temaSalvo === 'light') {
                document.documentElement.classList.remove('dark');
                atualizarIconeTema(false);
            } else {
                document.documentElement.classList.add('dark');
                atualizarIconeTema(true);
            }
        }

        function alternarTema() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('nexxa_tema', isDark ? 'dark' : 'light');
            atualizarIconeTema(isDark);
        }

        function atualizarIconeTema(isDark) {
            const icon = document.getElementById('theme-icon');
            if (icon) {
                icon.className = isDark ? 'fa-solid fa-sun text-sm' : 'fa-solid fa-moon text-sm';
            }
        }

        btnToggleTheme.addEventListener('click', (e) => {
            e.preventDefault();
            alternarTema();
        });

        inicializarTema();

        // Navegação de Telas
        btnShowRegister.addEventListener('click', (e) => {
            e.preventDefault();
            loginScreen.classList.add('hidden');
            registerScreen.classList.remove('hidden');
            forgotScreen.classList.add('hidden');
            hideAlert();
        });

        btnShowForgot.addEventListener('click', (e) => {
            e.preventDefault();
            loginScreen.classList.add('hidden');
            forgotScreen.classList.remove('hidden');
            registerScreen.classList.add('hidden');
            hideAlert();
        });

        btnBackLogin.addEventListener('click', (e) => {
            e.preventDefault();
            registerScreen.classList.add('hidden');
            loginScreen.classList.remove('hidden');
            hideAlert();
        });

        btnBackLoginForgot.addEventListener('click', (e) => {
            e.preventDefault();
            forgotScreen.classList.add('hidden');
            loginScreen.classList.remove('hidden');
            hideAlert();
        });

        // Redefinir Senha (Apenas manipula o registro id='usuarios')
        formForgot.addEventListener('submit', async (e) => {
            e.preventDefault();
            const usuarioAlvo = forgotUser.value.trim();
            const lojaAlvo = forgotLoja.value;
            const novaSenha = forgotNewPass.value.trim();

            showAlert("A atualizar senha...", "info");

            try {
                const { data: cloudData, error } = await supabaseClient.from('nexxa_store').select('*');
                if (error) throw error;

                let registroUsuarios = cloudData.find(d => d.id === 'usuarios');
                if (!registroUsuarios || !registroUsuarios.data || !Array.isArray(registroUsuarios.data)) {
                    showAlert("Nenhum utilizador cadastrado no sistema.", "warning");
                    return;
                }

                let listaUsuarios = registroUsuarios.data;
                const indexUser = listaUsuarios.findIndex(u => 
                    String(u.nome).trim().toUpperCase() === usuarioAlvo.toUpperCase() &&
                    String(u.loja).trim().toUpperCase() === lojaAlvo.toUpperCase()
                );

                if (indexUser === -1) {
                    showAlert(`Utilizador "${usuarioAlvo}" não encontrado na loja ${lojaAlvo}.`, "warning");
                    return;
                }

                listaUsuarios[indexUser].senha = novaSenha;

                const { error: updateError } = await supabaseClient
                    .from('nexxa_store')
                    .update({ data: listaUsuarios })
                    .eq('id', 'usuarios');

                if (updateError) throw updateError;

                showAlert("Senha atualizada com sucesso! Faça login.", "info");
                formForgot.reset();
                setTimeout(() => {
                    forgotScreen.classList.add('hidden');
                    loginScreen.classList.remove('hidden');
                    hideAlert();
                }, 1500);

            } catch (err) {
                console.error("Erro ao redefinir senha:", err);
                showAlert("Erro ao redefinir senha: " + err.message, "error");
            }
        });

        // Cadastrar Novo Utilizador (Preserva os restantes dados da tabela)
        formRegister.addEventListener('submit', async (e) => {
            e.preventDefault();
            const novoNome = regUser.value.trim();
            const novaSenha = regPass.value.trim();
            const novaLoja = regLoja.value;

            showAlert("A cadastrar novo utilizador...", "info");

            try {
                const { data: cloudData, error } = await supabaseClient.from('nexxa_store').select('*');
                if (error) throw error;

                let registroUsuarios = cloudData.find(d => d.id === 'usuarios');
                let listaUsuarios = [];

                if (registroUsuarios && registroUsuarios.data && Array.isArray(registroUsuarios.data)) {
                    listaUsuarios = registroUsuarios.data;
                }

                const existeNaMesmaLoja = listaUsuarios.some(u => 
                    String(u.nome).trim().toUpperCase() === novoNome.toUpperCase() && 
                    String(u.loja).trim().toUpperCase() === novaLoja.toUpperCase()
                );

                if (existeNaMesmaLoja) {
                    showAlert(`O utilizador "${novoNome}" já existe cadastrado na loja ${novaLoja}.`, "warning");
                    return;
                }

                listaUsuarios.push({ nome: novoNome, senha: novaSenha, loja: novaLoja });

                if (registroUsuarios) {
                    const { error: updateError } = await supabaseClient
                        .from('nexxa_store')
                        .update({ data: listaUsuarios })
                        .eq('id', 'usuarios');
                    if (updateError) throw updateError;
                } else {
                    const { error: insertError } = await supabaseClient
                        .from('nexxa_store')
                        .insert([{ id: 'usuarios', data: listaUsuarios }]);
                    if (insertError) throw insertError;
                }

                showAlert("Utilizador cadastrado com sucesso! Faça login.", "info");
                formRegister.reset();
                setTimeout(() => {
                    registerScreen.classList.add('hidden');
                    loginScreen.classList.remove('hidden');
                    hideAlert();
                }, 1500);

            } catch (err) {
                console.error("Erro ao cadastrar:", err);
                showAlert("Erro ao salvar utilizador: " + err.message, "error");
            }
        });

        // Gerenciar Login (Original - 100% Funcional com Supabase)
        formLogin.addEventListener('submit', async (e) => {
            e.preventDefault();
            const usuarioDigitado = loginUser.value.trim();
            const senhaDigitada = loginPass.value.trim();

            if (!usuarioDigitado || !senhaDigitada) {
                showAlert("Preencha o utilizador e a senha.", "warning");
                return;
            }

            showAlert("A autenticar...", "info");

            try {
                const { data: cloudData, error } = await supabaseClient.from('nexxa_store').select('*');
                if (error) throw error;

                const registroUsuarios = cloudData.find(d => d.id === 'usuarios');

                if (!registroUsuarios || !registroUsuarios.data || !Array.isArray(registroUsuarios.data)) {
                    showAlert("Nenhum utilizador cadastrado na base ainda. Cadastre um novo.", "warning");
                    return;
                }

                const userFound = registroUsuarios.data.find(u => 
                    String(u.nome).trim().toUpperCase() === usuarioDigitado.toUpperCase() && 
                    String(u.senha).trim() === senhaDigitada
                );

                if (!userFound) {
                    showAlert("Utilizador ou senha incorretos.", "warning");
                    return;
                }

                usuarioLogado = {
                    nome: userFound.nome,
                    loja: userFound.loja
                };

                hideAlert();
                loginScreen.classList.add('hidden');
                appScreen.classList.remove('hidden');

                lblLojaNome.innerText = `Loja: ${usuarioLogado.loja}`;
                lblUserNome.innerText = `Utilizador: ${usuarioLogado.nome}`;
                resultsContainer.innerHTML = "";

                await carregarCategorias();

            } catch (err) {
                console.error("Erro no login:", err);
                showAlert("Erro ao conectar com o servidor: " + err.message, "error");
            }
        });

        // Logout
        btnLogout.addEventListener('click', (e) => {
            e.preventDefault();
            usuarioLogado = null;
            loginUser.value = "";
            loginPass.value = "";
            inputSearch.value = "";
            resultsContainer.innerHTML = "";
            appScreen.classList.add('hidden');
            loginScreen.classList.remove('hidden');
            hideAlert();
        });

        // Carregar Categorias dinamicamente (Apenas lê dados de vendas)
        async function carregarCategorias() {
            try {
                const { data: cloudData, error } = await supabaseClient.from('nexxa_store').select('*');
                if (error) throw error;

                let categoriasSet = new Set();
                const registroVendas = cloudData.find(d => d.id === 'vendas');
                const lojaDoUsuario = usuarioLogado.loja.toUpperCase();

                if (registroVendas && registroVendas.data) {
                    registroVendas.data.forEach(v => {
                        const clienteVenda = v.cliente ? String(v.cliente).trim().toUpperCase() : '';
                        let cat = v.categoria ? String(v.categoria).trim().toUpperCase() : '';
                        if (clienteVenda === lojaDoUsuario && cat) {
                            categoriasSet.add(cat);
                        }
                    });
                }

                selectCategoria.innerHTML = '<option value="">-- Escolha uma Categoria --</option>';
                Array.from(categoriasSet).sort().forEach(cat => {
                    let opt = document.createElement('option');
                    opt.value = cat;
                    opt.innerText = cat;
                    selectCategoria.appendChild(opt);
                });

            } catch (err) {
                console.error("Erro ao carregar categorias:", err);
            }
        }

        // Eventos de Busca e Filtro por Categoria
        btnBuscar.addEventListener('click', (e) => {
            e.preventDefault();
            selectCategoria.value = ""; 
            executarConsulta(inputSearch.value.trim().toUpperCase(), '');
        });

        selectCategoria.addEventListener('change', () => {
            const catSelecionada = selectCategoria.value;
            if (catSelecionada) {
                inputSearch.value = ""; 
                executarConsulta('', catSelecionada);
            }
        });

        inputSearch.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                selectCategoria.value = ""; 
                executarConsulta(inputSearch.value.trim().toUpperCase(), '');
            }
        });

        async function executarConsulta(termo, categoriaFiltro) {
            if (!usuarioLogado) return;

            if (!termo && !categoriaFiltro) {
                showAlert("Selecione uma categoria ou digite um termo para pesquisar.", "warning");
                return;
            }

            showAlert(`Buscando produtos para ${usuarioLogado.loja}...`, "info");
            resultsContainer.innerHTML = "";

            try {
                const { data: cloudData, error } = await supabaseClient.from('nexxa_store').select('*');
                if (error) throw error;

                const registroVendas = cloudData.find(d => d.id === 'vendas');
                const registroEstoque = cloudData.find(d => d.id === 'estoque' || d.id === 'ESTOQUE');

                if (!registroVendas || !registroVendas.data || !Array.isArray(registroVendas.data)) {
                    showAlert("Base de preços/vendas não localizada.", "error");
                    return;
                }

                let produtosMap = {};
                const lojaDoUsuario = usuarioLogado.loja.toUpperCase();

                // Função auxiliar para converter valores monetários em formato string ou número
                function parsePreco(val) {
                    if (val === undefined || val === null) return 0;
                    if (typeof val === 'number') return val;
                    let limpo = String(val).replace('R$', '').trim();
                    if (limpo.includes(',') && limpo.includes('.')) {
                        limpo = limpo.replace(/\./g, '').replace(',', '.');
                    } else if (limpo.includes(',')) {
                        limpo = limpo.replace(',', '.');
                    }
                    const num = parseFloat(limpo);
                    return isNaN(num) ? 0 : num;
                }

                // 1. Mapeia dados da tabela vendas para a loja do utilizador
                registroVendas.data.forEach(v => {
                    const clienteVenda = v.cliente ? String(v.cliente).trim().toUpperCase() : '';
                    const nomeProduto = v.produto ? String(v.produto).trim().toUpperCase() : '';
                    const catProduto = v.categoria ? String(v.categoria).trim().toUpperCase() : 'GERAL';
                    const ean = v.ean ? String(v.ean).trim() : '';
                    
                    const brutoPreco = v.vlrUnit !== undefined ? v.vlrUnit : (v.preco !== undefined ? v.preco : (v.valor !== undefined ? v.valor : v.precoVenda));
                    const precoUnitario = parsePreco(brutoPreco);

                    if (!ean || ean === '' || ean === '0' || ean.toUpperCase() === 'S/EAN') return;

                    if (clienteVenda === lojaDoUsuario) {
                        let atendeFiltro = false;
                        
                        if (categoriaFiltro) {
                            if (catProduto === categoriaFiltro) atendeFiltro = true;
                        } else if (termo) {
                            if (ean.includes(termo) || nomeProduto.includes(termo)) atendeFiltro = true;
                        }

                        if (atendeFiltro) {
                            if (!produtosMap[ean]) {
                                produtosMap[ean] = {
                                    produto: v.produto,
                                    categoria: catProduto,
                                    ean: ean,
                                    preco: precoUnitario,
                                    estoque: 0
                                };
                            } else {
                                if (precoUnitario > 0) {
                                    produtosMap[ean].preco = precoUnitario;
                                }
                            }
                        }
                    }
                });

                // 2. Mapeia o estoque da loja correspondente e TRATA NEGATIVOS COMO ZERO
                if (registroEstoque && registroEstoque.data) {
                    for (let k in registroEstoque.data) {
                        let item = registroEstoque.data[k];
                        let itemEan = item.ean ? String(item.ean).trim() : '';
                        let clienteEstoque = item.cliente ? String(item.cliente).trim().toUpperCase() : '';
                        
                        if (produtosMap[itemEan] && clienteEstoque === lojaDoUsuario) {
                            let qtdEstoque = Number(item.estoque) || 0;
                            produtosMap[itemEan].estoque = Math.max(0, qtdEstoque);
                        }
                    }
                }

                const listaProdutos = Object.values(produtosMap);

                if (listaProdutos.length === 0) {
                    showAlert("Nenhum produto com EAN válido encontrado para este filtro na sua loja.", "warning");
                    return;
                }

                hideAlert();
                listaProdutos.sort((a, b) => a.produto.localeCompare(b.produto));

                listaProdutos.forEach(item => {
                    const precoFormatado = item.preco > 0 
                        ? item.preco.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }) 
                        : 'R$ 0,00';

                    // URL pública da imagem no Supabase Storage baseada no EAN
                    const urlImagem = `https://mjkqkyuolsqhtxwzivof.supabase.co/storage/v1/object/public/produtos-imagens/${item.ean}.jpg`;
                    const imgFallback = "https://via.placeholder.com/80?text=Sem+Foto";

                    const card = document.createElement('div');
                    card.className = "bg-white dark:bg-slate-900 rounded-2xl p-4 border border-slate-200 dark:border-slate-800 shadow-xl flex justify-between items-center gap-3";
                    card.innerHTML = `
                        <div class="flex items-center gap-3 overflow-hidden">
                            <img src="${urlImagem}" 
                                 onerror="this.onerror=null; this.src='${imgFallback}';" 
                                 alt="${item.produto}" 
                                 class="w-14 h-14 object-cover rounded-xl border border-slate-200 dark:border-slate-800 shrink-0 bg-slate-100 dark:bg-slate-950">
                            
                            <div class="space-y-1 min-w-0">
                                <span class="text-[10px] bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 px-2 py-0.5 rounded border border-slate-200 dark:border-slate-700">${item.categoria}</span>
                                <h2 class="font-bold text-slate-900 dark:text-white text-sm leading-snug truncate">${item.produto}</h2>
                                <div class="flex items-center gap-2 text-[10px] text-slate-500 dark:text-slate-400 font-mono">
                                    <span>EAN: ${item.ean}</span>
                                    <span class="text-amber-600 dark:text-amber-400 font-semibold">| Est: ${item.estoque}</span>
                                </div>
                            </div>
                        </div>
                        <div class="text-right shrink-0">
                            <span class="text-[10px] text-slate-500 dark:text-slate-400 block">Preço Venda</span>
                            <span class="text-base font-extrabold text-emerald-600 dark:text-emerald-400">${precoFormatado}</span>
                        </div>
                    `;
                    resultsContainer.appendChild(card);
                });

            } catch (err) {
                console.error("Erro na consulta:", err);
                showAlert(`Erro ao consultar dados: ${err.message}`, "error");
            }
        }

        function showAlert(msg, type) {
            statusAlert.innerText = msg;
            statusAlert.className = "p-3 rounded-xl text-xs text-center font-medium border ";
            if (type === 'error') statusAlert.classList.add('bg-rose-100', 'dark:bg-rose-950/60', 'border-rose-300', 'dark:border-rose-800', 'text-rose-700', 'dark:text-rose-300');
            else if (type === 'warning') statusAlert.classList.add('bg-amber-100', 'dark:bg-amber-950/60', 'border-amber-300', 'dark:border-amber-800', 'text-amber-800', 'dark:text-amber-300');
            else if (type === 'info') statusAlert.classList.add('bg-white', 'dark:bg-slate-900', 'border-slate-200', 'dark:border-slate-800', 'text-amber-600', 'dark:text-amber-400');
            statusAlert.classList.remove('hidden');
        }

        function hideAlert() {
            statusAlert.classList.add('hidden');
        }
    </script>
</body>
</html>
